name: Temp Format
on:
  workflow_dispatch:
jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format .
      - name: Upload formatted patch
        shell: pwsh
        run: |
          git diff > format.patch
          if ((Get-Item format.patch).Length -gt 0) { Write-Host "has diff" } else { Write-Host "no diff" }
      - uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: format.patch
