name: kmail_desktop
description: Kmail Desktop - a premium, privacy-focused desktop email client foundation.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  window_manager: ^0.4.3
  collection: ^1.18.0
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  flutter_html: ^3.0.0-beta.2
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  enough_mail: ^2.1.6
  flutter_secure_storage: ^9.2.4
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1

dependency_overrides:
  html: 0.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sample_attachments/
